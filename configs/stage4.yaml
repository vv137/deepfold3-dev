base: stage3.yaml

# Stage 4 — stage3 at a 768-token crop with more chains per crop, then a short
# LR decay. Starts from the stage3 EMA shadow with a fresh optimizer and step
# counter (export it with `deepfold3 export --snapshot shadow`, as for stage3).
#
# PDB only: the distillation sets (long/short monomers, afdb_nvda, teddymer)
# are dropped. A list in a config replaces its base's list, so `datasets` here
# is the whole mix. Everything else (losses, conditioning dropout, diffusion
# 48, schedule shape) is stage3's. The step counts below are placeholders: set
# them before launch.

training:
  wandb_project: deepfold3-stage4

  max_tokens: 768
  # stage2/3's 13.5 atoms per token (6912 / 512) at 768 tokens.
  max_atoms: 10368

  # 1k warmup, constant to step 3000, cosine to 0 at 5000 (stage3's shape).
  warmup_steps: 1000
  finetune_decay_start: 3000
  finetune_max_steps: 5000
  max_steps: 5000

model:
  data:
    # Chains kept per crop (stage0-3: 20) and the record-level filter on total
    # chains (stage0-3: 30). Raised for the larger crop; equal, so no record is filtered for having more chains than a crop may keep.
    max_chains: 50
    max_total_chains: 50

datasets:
  - name: of3_pdb
    data_dir: /data/pdb_training_set
    of3_cache_dir: /data/pdb_training_set/df3_cache
    template_cache_dir: /data/pdb_training_set/templates/train_template_cache
    weight: 1.0
    strategy: weighted
    is_distillation: false
    format: of3pdb
    cutoff_date: "2021-09-30"
    crop_weights: { contiguous: 0.2, spatial: 0.4, interface: 0.4 }
