base: stage3-from-stage1.yaml

# Classifier-free-guidance retrofit on a stage1-line checkpoint: trunk,
# confidence head and distogram head frozen; the diffusion head learns the
# trunk-pair conditioning drop that stage1 / stage3-s1 never saw.
#
# Start: the EMA shadow of the chosen stage3-s1 run (stage3-s1-001 or
# stage3-s1-core-001), exported with `deepfold3 export --snapshot shadow` and
# passed with --params. Fresh optimizer, scheduler and step counter.
#
# Frozen: evo_cond_encoder, evoformer (templates, MSA stack, pairformer),
# confidence_head, distogram_head. The trunk builds no autograd graph.
# Losses: diffusion MSE + bond only. alpha_confidence 0 skips the confidence
# forward; tm_true / itm_true are still logged (loss.py computes them from the
# mini-rollout whenever alpha_pae > 0, and alpha_pae stays 1.0; they need no
# confidence head). Predicted pLDDT / PAE are not computed.
#
# Conditioning drop: stage2's (20% of forwards; half the whole trunk pair,
# half a random subset of inter-chain blocks). What a dropped entry becomes is
# the experiment: `zero` here, `learned` in stage3-s1-frozen-cfg-learned.yaml.
#
# Schedule: 5k steps, 500 (10%) linear warmup, peak to 2500, linear decay to 0
# at 5000. Checkpoint every 100 steps (max_checkpoints 0 keeps all).
#
# Data: of3_pdb 0.50 -> 0.60; the four distillation sets scaled by 0.8.

training:
  wandb_project: deepfold3-stage3-frozen-cfg

  freeze_modules: [evo_cond_encoder, evoformer, confidence_head, distogram_head]
  alpha_confidence: 0.0
  alpha_distogram: 0.0
  alpha_smooth_lddt: null
  alpha_shape_comp: 0.0
  alpha_bond: 1.0

  warmup_steps: 500
  finetune_scheduler: linear
  finetune_decay_start: 2500
  finetune_max_steps: 5000
  finetune_min_lr_ratio: 0.0
  max_steps: 5000

  checkpoint_interval: 100

model:
  diffusion:
    use_conditioning_prob: 0.8
    cond_drop: pair
    cond_drop_interface_frac: 0.5
    cond_drop_fill: zero

datasets:

  - name: long_monomers
    data_dir: /data/distillation/long_monomers/preprocessed
    weight: 0.16
    strategy: uniform
    is_distillation: true
    format: of3
    # AlphaFold-2 predictions of MGnify sequences: pin templates to AF3's
    # distillation cutoff (§2.4). The pseudo-labels were generated by AF2
    # (template cutoff 2018-04-30), so a later template would leak structural
    # information the label generator never had. "" would inherit 2021-09-30.
    max_template_date: "2018-04-30"
    # Single-chain: interface crop always degrades to spatial, so route its
    # mass to spatial instead of wasting crop attempts on a missing interface.
    crop_weights: { contiguous: 0.25, spatial: 0.75, interface: 0.0 }

  - name: short_monomers
    data_dir: /data/distillation/short_monomers/preprocessed
    weight: 0.04
    strategy: uniform
    is_distillation: true
    format: of3
    max_template_date: "2018-04-30" # AF2 distillation cutoff (see long_monomers)
    crop_weights: { contiguous: 0.25, spatial: 0.75, interface: 0.0 }

  - name: afdb_nvda
    data_dir: /data/distillation/afdb_nvda
    weight: 0.12
    strategy: weighted
    is_distillation: true
    format: df3
    max_template_date: "2018-04-30" # AFDB = AF2 predictions; AF2 template cutoff (AF3 §2.4)
    template_struct_space: true # unstamped source; struct-space hits (see above)
    crop_weights: { contiguous: 0.1, spatial: 0.5, interface: 0.4 }

  - name: teddymer
    data_dir: /data/distillation/teddymer
    weight: 0.08
    strategy: weighted
    is_distillation: true
    format: df3
    max_template_date: "2018-04-30" # AFDB = AF2 predictions
    template_struct_space: true # unstamped source; struct-space hits (see above)
    crop_weights: { contiguous: 0.1, spatial: 0.5, interface: 0.4 }

  - name: of3_pdb
    data_dir: /data/pdb_training_set
    of3_cache_dir: /data/pdb_training_set/df3_cache # default: {data_dir}/df3_cache
    # Stated rather than defaulted: the hit lists are the one per-subset artefact
    # under a shared root (see of3_pdb_eval below), and the implicit resolution
    # silently falls back to the OTHER split's cache when this directory is
    # missing — a half-synced mirror would then train on validation hit lists.
    template_cache_dir: /data/pdb_training_set/templates/train_template_cache
    weight: 0.60
    strategy: weighted
    is_distillation: false
    format: of3pdb
    cutoff_date: "2021-09-30"
    crop_weights: { contiguous: 0.2, spatial: 0.4, interface: 0.4 }
    # Templates additionally get the per-query `released - 60d` tightening
    # (data.template_cutoff_days); "" inherits data.max_template_date.
    # max_template_date: ""

